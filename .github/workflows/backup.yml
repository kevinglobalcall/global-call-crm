# ⑤ 每晚備份 —— 香港凌晨 3 點
#
# 出兩樣嘢，一齊上 GitHub artifact（留 90 日，Actions 頁撳入去下載）：
#   · gc-<日子>.dump —— pg_dump，可以完整還原成個 DB（要有 Postgres）
#   · csv/ —— 每張表一個 CSV（UTF-8 BOM），Excel 直接開，唔使 Postgres 都睇得明
# ❗兩樣都驗過先算：dump 要 pg_restore --list 讀得返；CSV 每張表行數要對得返 count(*)。
# ❗未試過還原嘅備份唔算備份 —— 還原步驟見 README「還原」。

name: ⑤ 每晚備份

# ❗2026-10-26 Kevin「crm停止運作」→「想熄咗佢」：CRM 停用，每晚自動備份停咗（淨係留手動）。
#   開返用就將下面兩行 schedule 解返註釋。
on:
  # schedule:
  #   - cron: "7 19 * * *" # UTC 19:07 ＝ 香港 03:07（唔揀整點，避開 GitHub 塞車）
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 預檢
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub secret DATABASE_URL 未設定 —— 冇得備份"; exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # pg_dump 版本一定要 ≥ server（Supabase 新 project 係 PG17；Ubuntu 自帶得 16）
      - name: 裝同 server 一樣版本嘅 pg_dump
        id: pg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          major=$(psql "$DATABASE_URL" -Atc "show server_version_num" | cut -c1-2)
          echo "server 係 PG$major"
          if [ ! -x "/usr/lib/postgresql/$major/bin/pg_dump" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq "postgresql-client-$major" >/dev/null
          fi
          echo "bin=/usr/lib/postgresql/$major/bin" >> "$GITHUB_OUTPUT"

      - name: pg_dump ＋ 驗
        id: dump
        run: |
          day=$(TZ=Asia/Hong_Kong date +%F)
          mkdir -p out
          "${{ steps.pg.outputs.bin }}/pg_dump" "$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc -f "out/gc-$day.dump"
          n=$("${{ steps.pg.outputs.bin }}/pg_restore" --list "out/gc-$day.dump" | grep -c "TABLE DATA" || true)
          echo "dump 有 $n 張表嘅資料，$(du -h out/gc-$day.dump | cut -f1)"
          [ "$n" -gt 0 ] || { echo "::error::dump 入面冇資料"; exit 1; }
          echo "day=$day" >> "$GITHUB_OUTPUT"

      - name: 每張表一個 CSV（Excel 開得）
        run: node --import tsx src/db/export-csv.ts "out/csv"

      - uses: actions/upload-artifact@v4
        with:
          name: gc-backup-${{ steps.dump.outputs.day }}
          path: out/
          retention-days: 90
