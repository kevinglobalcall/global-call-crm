<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e2753">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GC CRM">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<title>Global Call CRM</title>
<link rel="icon" type="image/png" href="/app/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app/app.css">
<script>
  // 深淺色：一開頁就套用（唔好閃一下白先轉深）。預設深色（Kevin 2026-10-16「web也要dark mode」）；
  // 「跟系統」＝ 唔寫 data-theme，由 CSS 個 prefers-color-scheme 話事。讀唔到 localStorage 照用深色。
  (function () {
    var t = "dark";
    try { t = localStorage.getItem("gc-theme") || "dark"; } catch (e) {}
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><img src="/app/logo.png" alt="" width="30" height="30">Global Call <small>CRM</small></a>
  <div class="gsearch" role="search">
    <input type="search" id="gq" placeholder="搵公司／電話／電郵／聯絡人／備註" autocomplete="off" aria-label="全站搜尋">
    <div class="gres" id="gres" hidden></div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>今日</a>
    <a href="#/companies" data-tab="companies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg>公司</a>
    <a href="#/calendar" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>日曆</a>
    <a href="#/stats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>數</a>
    <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>更多</a>
  </nav>
  <button type="button" class="themebtn" id="themeBtn" aria-label="深淺色"></button>
</header>
<main id="view" aria-live="polite"><p class="muted pad">載入緊…</p></main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/app/app.js"></script>
</body>
</html>
