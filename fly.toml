# Fly.io 設定 —— app 名喺呢度改一次就得（workflows 由呢度讀）
app = "global-call-crm"

# 新加坡。❗唔好用 hkg：Fly 已經廢咗香港 region，開機會直接失敗。
# Supabase project 都開喺 Singapore，部機同 DB 同城，來回約 1ms。
primary_region = "sin"

[build]

# 每次部署前喺一部臨時機行 migration；行唔過就唔部署（舊版照行，唔會半新半舊）
[deploy]
  release_command = "node --import tsx src/db/migrate.ts"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false     # 長開：第二期每朝 email、日曆同步要部機醒住
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
